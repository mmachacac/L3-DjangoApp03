<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de pregunta</title>
</head>
<body>
    <h1>{{ pregunta.pregunta_texto }}</h1>

    <form action="{% url 'votar' pregunta.id %}" method="post">
        {% csrf_token %}

        {% for opcion in pregunta.opcion_set.all %}
            <input type="radio"
                   name="opcion"
                   id="opcion{{ forloop.counter }}"
                   value="{{ opcion.id }}">

            <label for="opcion{{ forloop.counter }}">
                {{ opcion.opcion_texto }}
            </label>
            <br>
        {% endfor %}

        <br>
        <input type="submit" value="Votar">
    </form>
</body>
</html>
